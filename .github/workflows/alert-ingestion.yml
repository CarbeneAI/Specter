name: Alert ingestion

on:
  push:
    paths:
      - '.gitignore'
      - 'apps/server/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/alert-identities.md'
      - 'docs/architecture*.md'
      - '.github/workflows/alert-ingestion.yml'
  pull_request:
    paths:
      - '.gitignore'
      - 'apps/server/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'docs/alert-identities.md'
      - 'docs/architecture*.md'
      - '.github/workflows/alert-ingestion.yml'

permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked server dependencies
        run: bun install --frozen-lockfile --no-env-file
      - name: Test server without external services
        run: bun test --no-env-file
      - name: Typecheck server and fixtures
        run: bun run --no-env-file typecheck
