name: Wazuh polling continuity

on:
  pull_request:
    paths:
      - apps/server/**
      - .gitignore
      - README.md
      - docs/poll-single-flight.md
      - .github/workflows/poll-single-flight.yml
  push:
    paths:
      - apps/server/**
      - .gitignore
      - README.md
      - docs/poll-single-flight.md
      - .github/workflows/poll-single-flight.yml

permissions:
  contents: read

jobs:
  polling-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked server dependencies
        working-directory: apps/server
        run: bun install --frozen-lockfile --no-env-file
      - name: Test polling responses and continuity offline
        working-directory: apps/server
        run: bun --no-env-file test
      - name: Typecheck production and fixture code
        working-directory: apps/server
        run: bun run --no-env-file typecheck
