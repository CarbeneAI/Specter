name: Alert search integrity

on:
  push:
    paths:
      - apps/server/**
      - .gitignore
      - README.md
      - ROADMAP.md
      - docs/alert-search-integrity.md
      - .github/workflows/alert-search.yml
  pull_request:
    paths:
      - apps/server/**
      - .gitignore
      - README.md
      - ROADMAP.md
      - docs/alert-search-integrity.md
      - .github/workflows/alert-search.yml

permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install identical locked server dependencies
        run: bun install --frozen-lockfile --no-env-file
      - name: Test server with offline and loopback fixtures
        run: bun test --no-env-file
      - name: Typecheck server and fixtures
        run: bun run --no-env-file typecheck
